[variables]
# Let Nixpacks manage Python dependencies from requirements.txt.
NIXPACKS_PYTHON_PACKAGE_MANAGER = "pip"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = ["pip --version", "pip install --upgrade pip", "pip install --no-cache-dir -r requirements.txt", "python -c 'import telegram, openai; print(\"Dependencies installed successfully\")'"]

[start]
cmd = "python telegram_bot.py"
